name: Hypersnap client
on:
  push:
    paths: ['hypersnap/**', '.github/workflows/hypersnap.yml']
  pull_request:
    paths: ['hypersnap/**', '.github/workflows/hypersnap.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hypersnap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: hypersnap/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn verify
      - name: Check offline signer payload reproducibility
        run: |
          cp dist-signer/BUILD-MANIFEST.json /tmp/arca-signer-manifest.json
          yarn signer:build
          diff -u /tmp/arca-signer-manifest.json dist-signer/BUILD-MANIFEST.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arca-signer-reviewed-payload
          path: hypersnap/dist-signer/
          retention-days: 30
